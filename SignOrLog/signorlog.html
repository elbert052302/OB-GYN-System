<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GentleCare | Log In</title>
  <link rel="stylesheet" href="./signorlog.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="brand-panel">
      <div class="brand-inner">
        <img class="brand-logo" src="../Patient/gentlecare-Logo.png" alt="GentleCare Logo" />
        <h1 class="brand-name">GentleCare</h1>
      </div>
    </div>

    <div class="form-panel">
      <h2>Welcome to Gentle Care</h2>
      <p class="subtext" id="loginIntro">Log in to continue to your GentleCare portal.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmailPhone">Email Address</label>
          <input type="email" id="loginEmailPhone" placeholder="Email Address" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false" title="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="primary-btn">Log In</button>
        <p id="loginStatus" class="small-link" aria-live="polite"></p>
      </form>

      <div class="divider">Create Account</div>
      <div class="inline-select">
        <label class="visually-hidden" for="createAccountType">Account type</label>
        <select id="createAccountType">
          <option value="patient">For Patient</option>
          <option value="doctor">For Doctor</option>
          <option value="clinic">For Clinic</option>
        </select>
      </div>
      <button class="secondary-btn" id="goToRegisterBtn" type="button">Create Account</button>
      <p class="small-link">Need access? Contact your clinic.</p>
    </div>
  </div>

  <script src="../Backend/client.js"></script>
  <script src="./signorlog.js"></script>
</body>
</html>
