<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GentleCare | Doctor Sign Up</title>
  <link rel="stylesheet" href="./doctor.css" />
  <style>
    :root {
      --doctor-blue: #1a73e8;
      --doctor-soft: #dfeaff;
      --ink: #24313a;
      --slate: #667784;
      --panel: rgba(255,255,255,0.92);
      --border: rgba(113,126,139,0.14);
      --shadow: rgba(78,85,95,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f5f9ff 0%, #edf3fb 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: min(100%, 560px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 24px 50px var(--shadow);
      padding: 36px 28px;
    }
    .brand {
      text-align: center;
      margin-bottom: 18px;
    }
    .brand img {
      width: 180px;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }
    .brand h1 {
      margin: 0;
      letter-spacing: -0.06em;
      font-size: clamp(2.1rem, 2.5vw, 3rem);
      color: var(--doctor-blue);
    }
    h2 {
      text-align: center;
      margin: 0 0 20px;
      letter-spacing: -0.04em;
      font-size: clamp(1.8rem, 2vw, 2.25rem);
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--slate);
      font-weight: 600;
    }
    input, select, button {
      font: inherit;
    }
    input, select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(118,130,140,0.18);
      background: rgba(255,255,255,0.86);
      transition: 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: rgba(26,115,232,0.7);
      box-shadow: 0 0 0 4px rgba(223,234,255,0.7);
    }
    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--doctor-soft) 0%, #cfe1ff 100%);
      color: var(--ink);
      font-weight: 800;
      padding: 15px 18px;
      cursor: pointer;
      margin-top: 10px;
    }
    .small-link {
      text-align: center;
      margin-top: 18px;
      color: var(--slate);
      font-size: 0.92rem;
    }
    .small-link a {
      color: var(--doctor-blue);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../Patient/gentlecare-Logo.png" alt="GentleCare Logo" />
      <h1>GentleCare</h1>
    </div>

    <h2>Doctor Registration</h2>

    <form id="doctorSignupForm">
      <div class="field">
        <label for="doctorName">Full Name</label>
        <input type="text" id="doctorName" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="doctorEmail">Email</label>
        <input type="email" id="doctorEmail" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="doctorPassword">Password</label>
        <input type="password" id="doctorPassword" autocomplete="new-password" minlength="12" maxlength="128" required />
      </div>

      <div class="field">
        <label for="doctorLicense">License Number</label>
        <input type="text" id="doctorLicense" required />
      </div>

      <div class="field">
        <label for="doctorSpecialization">Specialization</label>
        <input type="text" id="doctorSpecialization" required />
      </div>

      <div class="field">
        <label for="doctorTimeZone">Default time zone for future practice locations</label>
        <select id="doctorTimeZone" name="time_zone" required></select>
      </div>

      <button type="submit" class="submit-btn">Register</button>
      <p id="registrationStatus" class="small-link" aria-live="polite"></p>
    </form>

    <p class="small-link">Already have an account? <a href="../SignOrLog/signorlog.html">Log In</a></p>
  </div>

  <script src="../Backend/client.js"></script>
  <script src="./doctor.js"></script>
</body>
</html>
